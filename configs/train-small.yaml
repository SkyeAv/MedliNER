# Laptop-safe starting configuration for one RTX 5070 Ti with 12 GB VRAM.
model_id: urchade/gliner_small-v2.1
seed: 2026
max_length: 384
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.00005
weight_decay: 0.01
num_train_epochs: 5
max_steps: -1
warmup_ratio: 0.1
logging_steps: 1
eval_steps: 25
save_steps: 25
save_total_limit: 2
fp16: false
bf16: true
gradient_checkpointing: true
freeze_text_encoder: false
