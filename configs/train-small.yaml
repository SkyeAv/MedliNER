# Laptop-safe starting configuration for one RTX 5070 Ti with 12 GB VRAM.
model_id: urchade/gliner_small-v2.1
seed: 2026

# Sequence and span budgets. Longer text or wider gold spans are rejected at conversion time
# rather than silently truncated/dropped by GLiNER; see docs/TRAINING.md.
max_length: 384

# Micro-batch plus accumulation keeps peak VRAM low. Reduce max_length before raising the batch.
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
dataloader_num_workers: 0

learning_rate: 0.00005
weight_decay: 0.01
max_grad_norm: 1.0
lr_scheduler_type: linear
num_train_epochs: 5
max_steps: -1
warmup_ratio: 0.1

# save_steps must be a multiple of eval_steps: the best checkpoint is selected from steps that
# were both evaluated and saved.
logging_steps: 1
eval_steps: 25
save_steps: 25
save_total_limit: 2
resume: true

# Validation-driven selection and early stopping on strict typed-span F1.
evaluation_threshold: 0.3
early_stopping_patience: 2

# Mixed precision. Exactly one of fp16/bf16; both are ignored on CPU.
fp16: false
bf16: true

gradient_checkpointing: true
freeze_text_encoder: false

# Entity vocabulary pinned for every batch. Defaults to the two MedliNER labels.
labels:
  - disease
  - phenotype
