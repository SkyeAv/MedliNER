[project]
name = "medliner"
version = "0.1.0"
description = "Reproducible GLiNER fine-tuning and evaluation for medical indication, contraindication, and drug NER."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dagster>=1.9,<2",
  "dagster-webserver>=1.9,<2",
  "accelerate>=1.1,<2",
  "blake3>=1,<2",
  "gliner==0.2.28",
  "loguru>=0.7,<1",
  "polars>=1.30,<2",
  "torch>=2.9,<3",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
medliner = "medliner.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.uv.sources]
# The laptop RTX 5070 Ti is compute capability sm_120. Use a CUDA wheel that contains
# sm_120 kernels; the cu126 wheel used by the sibling DAKP/P100 environment does not.
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/medliner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
