[project]
name = "medliner"
version = "0.1.0"
description = "Reproducible medical NER annotation workflow: candidate sampling, GLiNER pre-labeling, and a local Label Studio pipeline for indication/contraindication data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "gliner==0.2.28",
  # Pinned alongside gliner; not left to gliner's transitive pin.
  "transformers>=4.46",
  "torch>=2.9,<3",
  "pydantic>=2.8,<3",
  # blake3 backs the deterministic task IDs and file hashes in candidates.py and export ingest.
  "blake3>=1,<2",
]

[dependency-groups]
test = [
  "pytest>=8,<9",
  "pytest-cov>=5",
]
ci = [
  { include-group = "test" },
]
dev = [
  { include-group = "ci" },
  "pre-commit>=4.5.1",
  "ruff>=0.15.6",
]

[project.scripts]
medliner = "medliner.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.uv.sources]
# The laptop RTX 5070 Ti is compute capability sm_120. Use a CUDA wheel that contains
# sm_120 kernels; the cu126 wheel used by the sibling DAKP/P100 environment does not.
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/medliner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "RUF100", "B", "SIM", "C4", "PT", "RUF", "TID", "I", "PIE", "RET", "UP"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
